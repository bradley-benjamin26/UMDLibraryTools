<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UMD Library Checker</title>
    <style>
      :root {
        --umd-red: #e21833;
        --umd-red-dark: #b11128;
        --umd-gold: #ffd200;
        --umd-dark: #454545;
        --umd-ink: #1f2937;
        --umd-border: #d0d7de;
        --umd-surface: rgba(255, 255, 255, 0.96);
        --umd-focus: #005fcc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 320px;
        padding: 16px;
        font-family: Arial, sans-serif;
        color: var(--umd-ink);
        background:
          radial-gradient(circle at top left, rgba(255, 210, 0, 0.22), transparent 38%),
          radial-gradient(circle at bottom right, rgba(226, 24, 51, 0.16), transparent 30%),
          linear-gradient(180deg, #fdfdfd 0%, #f3f5f8 100%);
      }

      .popup-shell {
        display: grid;
        gap: 14px;
      }

      .popup-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(226, 24, 51, 0.18);
        border-radius: 20px;
        background: var(--umd-surface);
        box-shadow: 0 18px 40px rgba(31, 41, 55, 0.16);
        padding: 18px;
      }

      .popup-card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, var(--umd-red), var(--umd-gold));
      }

      .popup-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 210, 0, 0.24);
        color: var(--umd-dark);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 8px;
        color: var(--umd-red-dark);
        font-size: 20px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 14px;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.5;
      }

      #pageStatus {
        margin-bottom: 10px;
        color: #111827;
        font-size: 13px;
        font-weight: 700;
      }

      #proxyMessage {
        margin-bottom: 16px;
        color: #4b5563;
        font-size: 13px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--umd-red-dark);
        border-radius: 14px;
        background: linear-gradient(180deg, var(--umd-red) 0%, var(--umd-red-dark) 100%);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(226, 24, 51, 0.22);
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(226, 24, 51, 0.28);
      }

      button:focus-visible {
        outline: 3px solid var(--umd-focus);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div class="popup-shell">
      <div class="popup-card">
        <div class="popup-badge">UMD Library Tools</div>
        <h1>Open the current page with UMD access</h1>
        <p id="pageStatus">Checking current tab…</p>
        <p id="proxyMessage">This button sends the active page through the UMD proxy when the page supports it.</p>
        <button id="proxyButton" type="button">Open current page with UMD proxy</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
