<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UMCP Library Checker</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 300px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        color: #111827;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      .box {
        background: #f7f9fc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
      }
      p {
        margin: 8px 0 0;
        font-size: 12px;
        color: #1f2937;
      }
      button {
        width: 100%;
        margin-top: 12px;
        background: #0a6b2d;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #003a8c;
        outline-offset: 2px;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>UMCP Library Checker</h1>
    <div class="box">
      <p id="pageStatus" role="status" aria-live="polite">Popup is working.</p>
      <button id="proxyButton" type="button" aria-label="Open the current page through the UMD proxy">Open current page with UMD proxy</button>
      <p id="proxyMessage" aria-live="polite">This sends the current page through the University of Maryland proxy before loading it.</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
